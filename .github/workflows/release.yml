name: release

# 自建全平台编译分发(raystyle fork,2026-09-16 起;上游 release 停 1.37.0/master 活,自家出包)
# 自含策略:linux/win 官方 ARIA2_STATIC=yes 全静态单可执行(pkg-config 全程 --static 出全闭包,
# 头吃到 *_STATIC 宏免 dllimport;libtool 滤 -static 故静态旗落 make 层 LDFLAGS=-all-static);
# linux CA 走 --with-ca-bundle 系统证书;win 静态单 exe 免 mingw DLL 随包;mac 照上游 build.yml appletls 正形
# 分工:本仓管编译与 GitHub Release + mirror job 直推 R2 种子段 aria2/<版本>/(用户裁 2026-09-17 起,
# CI 自推种子接线;catalog 三键仍归总台);env 形 rclone remote(PROVIDER=Cloudflare+NO_CHECK_BUCKET,
# 版本段 Cache-Control immutable 头,digest 同即幂等覆盖)
# 触发:推 v* tag 正式发;workflow_dispatch 带 version 输入仅重推镜像段(幂等验证用)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '要重推镜像段的 tag(如 v1.37.2;留空则只记录)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag 对 configure.ac 版本一致性闸
        run: |
          VER="v$(grep -oP 'AC_INIT\(\[aria2\],\[\K[0-9.]+' configure.ac)"
          if [ "$GITHUB_REF_NAME" != "$VER" ]; then
            echo "tag $GITHUB_REF_NAME 与 configure.ac $VER 不符"
            exit 1
          fi

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: aria2-x86_64-pc-windows-gnu.zip
          - os: ubuntu-22.04
            asset: aria2-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            asset: aria2-aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # ---- windows x64(MSYS2 mingw64,静态链单 exe)----
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: mingw64
          update: false
          install: >-
            git make zip autoconf automake autoconf-archive libtool pkgconf
            gettext gettext-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libssh2
            mingw-w64-x86_64-c-ares
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-gettext
      - name: build (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          which gcc g++ make
          gcc --version | head -1
          echo "$PATH" | tr ':' '\n' | head -8
          autoreconf -i
          ARIA2_STATIC=yes ./configure --without-gnutls --with-openssl --disable-websocket --disable-nls CPPFLAGS="-D_WIN32_WINNT=0x0601 -DWINVER=0x0601" CFLAGS="-O2 -std=gnu17" CXXFLAGS="-O2 -std=gnu++17" LDFLAGS="-static" LIBS="-lws2_32" 2>&1 | tee configure.out
          grep -qE "^Static build: +yes" configure.out || { echo "=== ARIA2_STATIC 未生效 ==="; exit 1; }
          grep -n "define HAVE_WINSOCK2_H 1" config.h || { echo "=== winsock undetected; config.log excerpt ==="; awk '/checking for  winsock2.h usability/{f=1} f{print; c++} c>20{exit}' config.log; exit 1; }
          make -j"$(nproc)" LDFLAGS="-all-static"
          strip src/aria2c.exe
          objdump -p src/aria2c.exe | grep "DLL Name:" | tee imports.txt
          if grep -qiE "DLL Name: (lib|msys-|zlib1)" imports.txt; then echo "=== mingw DLL 依赖残留,非静态单 exe ==="; cat imports.txt; exit 1; fi
          mkdir -p dist
          cp src/aria2c.exe dist/
          PATH="/c/Windows/System32:/c/Windows" ./dist/aria2c.exe --version | head -1
          cd dist && zip "${{ matrix.asset }}" aria2c.exe
      - name: sidecar (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd dist
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          cat "${{ matrix.asset }}.sha256"

      # ---- linux x64(ubuntu-22.04,全静态单可执行;22.04 的 libc-ares-dev 带 libcares.a)----
      - name: build (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autotools-dev autopoint libtool pkg-config \
            g++ libssl-dev libc-ares-dev zlib1g-dev libsqlite3-dev libssh2-1-dev \
            libxml2-dev liblzma-dev libicu-dev libgmp-dev libgpg-error-dev libgcrypt-dev
          autoreconf -i
          ARIA2_STATIC=yes ./configure --without-gnutls --with-openssl --disable-websocket --disable-nls --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt 2>&1 | tee configure.out
          grep -qE "^Static build: +yes" configure.out || { echo "=== ARIA2_STATIC 未生效 ==="; exit 1; }
          make -j"$(nproc)" LDFLAGS="-all-static"
          strip src/aria2c
          file src/aria2c | tee file.out
          grep -q "statically linked" file.out || { echo "=== file 判非静态 ==="; exit 1; }
          ldd src/aria2c > ldd.out 2>&1 || true
          cat ldd.out
          grep -q "not a dynamic executable" ldd.out || { echo "=== 非全静态,依赖如上 ==="; exit 1; }
          mkdir -p dist
          cp src/aria2c dist/
          ./dist/aria2c --version | head -1
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 /dist/aria2c --version | head -1
          cd dist && tar czf "${{ matrix.asset }}" aria2c
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          cat "${{ matrix.asset }}.sha256"

      # ---- macos aarch64 ----
      - name: build (macos)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config gettext c-ares libssh2 sqlite3
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          autoreconf -i
          ./configure --without-openssl --without-gnutls --with-appletls --disable-nls --disable-websocket
          make -j"$(sysctl -n hw.ncpu)"
          strip src/aria2c
          mkdir -p dist
          cp src/aria2c dist/
          ./dist/aria2c --version | head -1
          cd dist && tar czf "${{ matrix.asset }}" aria2c
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          cat "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*

      - name: dump diag on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.asset }}
          path: |
            config.log
            config.h
            configure.out
            ldd.out
            file.out
            imports.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release create "$GITHUB_REF_NAME" --title "aria2 $GITHUB_REF_NAME" \
            --notes "raystyle fork 自建全平台编译(linux/win 全静态单可执行,mac 原生 appletls;上游 master 快照)。资产三包加逐件 .sha256 边车。" || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --latest

  # ---- R2 种子段直推(tag 发版后自动;dispatch 带 version 幂等重推)----
  mirror:
    if: >-
      needs.release.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: install rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -j -o /tmp/rclone.zip '*/rclone' -d /usr/local/bin
          rclone version | head -2
      - name: download release assets and recheck digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ (github.event_name == 'workflow_dispatch' && inputs.version) || github.ref_name }}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          gh release download "$VER" -R "$GITHUB_REPOSITORY" -D dist
          cd dist
          ls -la
          sha256sum -c ./*.sha256
      - name: push to R2 segment aria2/$VER
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENV_AUTH: true
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: true
        run: |
          BUCKET="${{ secrets.R2_BUCKET }}"
          SEG="r2:${BUCKET}/aria2/${VER}"
          rclone copy dist "$SEG" --header-upload "Cache-Control: public, max-age=31536000, immutable" -v
          rclone lsl "$SEG" | tee lsl.out
          test "$(wc -l < lsl.out)" -eq 6 || { echo "=== 段内对象数非六 ==="; exit 1; }
